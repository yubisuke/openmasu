name: Runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime:
    # Runtime containers are verified on Linux. Windows development uses Docker Desktop.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: openmasu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-synthetic-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmasu"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OPENMASU_MIGRATION_DATABASE_URL: postgresql://postgres:postgres-synthetic-ci@localhost:5432/openmasu
      OPENMASU_APP_DATABASE_PASSWORD: app-synthetic-ci-password
      OPENMASU_READER_DATABASE_PASSWORD: reader-synthetic-ci-password
      OPENMASU_SEED_DATABASE_PASSWORD: seed-synthetic-ci-password
      OPENMASU_APP_DATABASE_URL: postgresql://openmasu_app:app-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_READER_DATABASE_URL: postgresql://openmasu_reader:reader-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_SEED_DATABASE_URL: postgresql://openmasu_seed:seed-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_POSTGRES_HOST_PORT: "55432"
      OPENMASU_API_HOST_PORT: "8080"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Apply migrations twice and check schema
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:schema:check
      - name: Run runtime unit and integration tests
        run: |
          npm test
          npm run check:operational-logs
          npm run test:integration
          npm run test:db-invariants
          npm run test:env-coverage
      - name: Verify backup restore and completed privacy reapplication
        run: OPENMASU_M5_BACKUP_RESTORE=1 OPENMASU_M5_PG_TOOLS=docker npm run test:backup-restore
      - name: Run M2a redirector, signed-ingestion, replay, worker, and deletion gates
        run: npm run test:m2a
      - name: Reproduce contract goldens through PostgreSQL
        run: npm run seed && npm run verify:parity
      - name: Verify SQL cohort metrics against the contract evaluator
        run: npm run test:metric-parity
      - name: Verify raw, API, dashboard-view, and HTML consistency
        run: npm run verify:consistency
      - name: Run reduced synthetic metric performance floor
        run: OPENMASU_BENCHMARK_ROWS=100000 npm run benchmark:metric-floor
      - name: Check threat-model coverage
        run: npm run check:threat-model
      - name: Compose first-run smoke
        run: |
          export OPENMASU_MAX_TENANT_ID=tenant-a
          export OPENMASU_MAX_APP_ID=app-a
          export OPENMASU_ENROLL_RATE_RPS=10000
          export OPENMASU_ENROLL_RATE_BURST=2000
          export OPENMASU_INGEST_RATE_RPS=10
          export OPENMASU_INGEST_RATE_BURST=20
          export OPENMASU_INGEST_APP_RATE_RPS=10000
          export OPENMASU_INGEST_APP_RATE_BURST=2000
          export OPENMASU_MAX_RATE_RPS=20000
          export OPENMASU_MAX_RATE_BURST=12000
          docker compose up -d --wait
          docker compose --env-file /dev/null --profile seed run --rm seed
          docker compose --env-file /dev/null exec -T api sh -c 'set -a && . /run/openmasu/app/runtime.env && set +a && OPENMASU_API_HOST_PORT=8080 node --import tsx tools/runtime-smoke.ts'
      - name: Measure synthetic ingestion and MAX postback load
        run: |
          docker compose --env-file /dev/null exec -T api sh -c 'set -a && . /run/openmasu/app/runtime.env && set +a && node --import tsx tools/m5-load.ts' > m5-load.json
          cat m5-load.json
      - name: Upload M5 load evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m5-synthetic-load
          path: m5-load.json
          if-no-files-found: error
      - name: Generate workspace SBOMs
        run: npm run sbom
      - name: Enforce the M3 API runtime component baseline
        run: npm run check:api-runtime-sbom
      - name: Upload workspace SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
