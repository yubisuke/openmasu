name: Runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime:
    # Runtime containers are verified on Linux. Windows development uses Docker Desktop.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: openmasu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-synthetic-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openmasu"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      OPENMASU_MIGRATION_DATABASE_URL: postgresql://postgres:postgres-synthetic-ci@localhost:5432/openmasu
      OPENMASU_APP_DATABASE_PASSWORD: app-synthetic-ci-password
      OPENMASU_READER_DATABASE_PASSWORD: reader-synthetic-ci-password
      OPENMASU_SEED_DATABASE_PASSWORD: seed-synthetic-ci-password
      OPENMASU_APP_DATABASE_URL: postgresql://openmasu_app:app-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_READER_DATABASE_URL: postgresql://openmasu_reader:reader-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_SEED_DATABASE_URL: postgresql://openmasu_seed:seed-synthetic-ci-password@localhost:5432/openmasu
      OPENMASU_POSTGRES_HOST_PORT: "55432"
      OPENMASU_API_HOST_PORT: "8080"
      OPENMASU_PILOT_PROJECT: openmasu-synthetic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect relevant changes
        id: scope
        env:
          OPENMASU_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          OPENMASU_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/ci/changed-scope.mjs
      - name: No runtime-sensitive changes
        if: steps.scope.outputs.run_runtime != 'true'
        run: echo "Application runtime suites are not required; any selected operator configuration checks still run."
      - name: Validate monitoring configuration and synthetic alert transitions
        if: steps.scope.outputs.run_runtime == 'true' || steps.scope.outputs.run_monitoring == 'true'
        shell: bash
        run: |
          set -euo pipefail
          monitoring_tools=$(mktemp -d "$RUNNER_TEMP/openmasu-monitoring.XXXXXX")
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz \
            --output "$monitoring_tools/prometheus.tgz"
          printf '%s  %s\n' 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0 "$monitoring_tools/prometheus.tgz" | sha256sum --check --status
          tar -xzf "$monitoring_tools/prometheus.tgz" --directory "$monitoring_tools" --strip-components=1 prometheus-3.15.0.linux-amd64/promtool
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz \
            --output "$monitoring_tools/alertmanager.tgz"
          printf '%s  %s\n' 265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8 "$monitoring_tools/alertmanager.tgz" | sha256sum --check --status
          tar -xzf "$monitoring_tools/alertmanager.tgz" --directory "$monitoring_tools" --strip-components=1 alertmanager-0.34.1.linux-amd64/amtool
          "$monitoring_tools/promtool" check config --syntax-only config/monitoring/prometheus.yml
          "$monitoring_tools/promtool" check rules config/monitoring/alerts.yml
          "$monitoring_tools/promtool" test rules config/monitoring/alerts.test.yml
          "$monitoring_tools/amtool" check-config config/monitoring/alertmanager.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.scope.outputs.run_runtime == 'true'
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install pinned npm
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm ci
      - name: Apply migrations twice and check schema
        if: steps.scope.outputs.run_runtime == 'true'
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:schema:check
      - name: Run runtime unit and integration tests
        if: steps.scope.outputs.run_runtime == 'true'
        run: |
          npm test
          npm run check:operational-logs
          npm run test:integration
          npm run test:db-invariants
          npm run test:env-coverage
          npm run check:fraud-sources
          npm run check:fraud-artifacts
      - name: Verify backup restore and completed privacy reapplication
        if: steps.scope.outputs.run_runtime == 'true'
        run: OPENMASU_M5_BACKUP_RESTORE=1 OPENMASU_M5_PG_TOOLS=docker npm run test:backup-restore
      - name: Reproduce contract goldens through PostgreSQL
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm run seed && npm run verify:parity
      - name: Verify SQL cohort metrics against the contract evaluator
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm run test:metric-parity
      # Signed ingestion, financial-import and dashboard-consistency tests are
      # already included in npm test + test:integration above. Focused aliases
      # remain available locally, but must not duplicate those suites in CI.
      - name: Run reduced synthetic metric performance floor
        if: steps.scope.outputs.run_runtime_performance == 'true'
        env:
          OPENMASU_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: OPENMASU_BENCHMARK_ROWS=100000 npm run benchmark:metric-floor --workspace @openmasu/worker -- --base-ref="$OPENMASU_CI_BASE_SHA"
      - name: Import 100,000 synthetic MMP rows within the pilot floor
        if: steps.scope.outputs.run_runtime_performance == 'true'
        run: npm run benchmark:import
      - name: Check threat-model coverage
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm run check:threat-model
      - name: Run isolated disposable synthetic runtime pilot
        if: steps.scope.outputs.run_runtime == 'true'
        env:
          OPENMASU_CI_RUN_LOAD: ${{ steps.scope.outputs.run_runtime_performance }}
        run: |
          if [ "$OPENMASU_CI_RUN_LOAD" = "true" ]; then
            npm run pilot:synthetic -- --disposable --load
          else
            npm run pilot:synthetic -- --disposable
          fi
      - name: Upload synthetic runtime pilot evidence
        if: always() && steps.scope.outputs.run_runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-runtime-pilot
          path: build/pilot-evidence/synthetic-runtime.json
          if-no-files-found: warn
      - name: Remove disposable pilot resources after cancellation or failure
        if: always() && steps.scope.outputs.run_runtime == 'true'
        run: docker compose --project-name "$OPENMASU_PILOT_PROJECT" down --volumes --remove-orphans --timeout 30
      - name: Upload M5 load evidence
        if: steps.scope.outputs.run_runtime_performance == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m5-synthetic-load
          path: build/pilot-evidence/m5-load.json
          if-no-files-found: error
      - name: Generate workspace SBOMs
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm run sbom
      - name: Enforce the M3 API runtime component baseline
        if: steps.scope.outputs.run_runtime == 'true'
        run: npm run check:api-runtime-sbom
      - name: Upload workspace SBOMs
        if: steps.scope.outputs.run_runtime == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error
