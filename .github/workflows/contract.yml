name: contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.13.5
      # Real-data guardrail (independent of npm run validate so it still fires if the
      # test harness itself is broken). This repository is public; fixtures are synthetic.
      - name: Reject tabular exports and lab/input directories
        shell: bash
        run: |
          set -euo pipefail
          offenders=$(git ls-files -z | tr '\0' '\n' | grep -Ei '\.(csv|tsv|xlsx|xls|parquet)$' || true)
          if [ -n "$offenders" ]; then echo "Tabular files are not allowed:"; echo "$offenders"; exit 1; fi
          offenders=$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(open-mmp-lab|real-data|input)(/|$)' || true)
          if [ -n "$offenders" ]; then echo "Forbidden directory segment:"; echo "$offenders"; exit 1; fi
          offenders=$(git ls-files -z -- fixtures | tr '\0' '\n' | grep -Ev '\.json$|(^|/)README\.md$' || true)
          if [ -n "$offenders" ]; then echo "fixtures/ may only contain .json and README.md:"; echo "$offenders"; exit 1; fi
          echo "Real-data guardrail passed."
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: python -m pip install --require-hashes --requirement requirements-contract.txt
      - run: npm run validate
