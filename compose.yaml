name: openmasu

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  networks:
    - backend

services:
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - node
      - --import
      - tsx
      - apps/runtime/src/bootstrap.ts
    environment:
      OPENMASU_REPOSITORY_ROOT: /repository
      OPENMASU_RUNTIME_SECRET_ROOT: /run/openmasu
      OPENMASU_PUBLIC_BASE_URL: http://localhost:8080
      OPENMASU_DATABASE_HOST: postgres
      OPENMASU_DATABASE_PORT: "5432"
      OPENMASU_DATABASE_NAME: openmasu
      OPENMASU_MAX_TENANT_ID: ${OPENMASU_MAX_TENANT_ID:-tenant-local}
      OPENMASU_MAX_APP_ID: ${OPENMASU_MAX_APP_ID:-app-local}
      OPENMASU_ENROLL_RATE_RPS: ${OPENMASU_ENROLL_RATE_RPS:-50}
      OPENMASU_ENROLL_RATE_BURST: ${OPENMASU_ENROLL_RATE_BURST:-100}
      OPENMASU_INGEST_RATE_RPS: ${OPENMASU_INGEST_RATE_RPS:-1}
      OPENMASU_INGEST_RATE_BURST: ${OPENMASU_INGEST_RATE_BURST:-20}
      OPENMASU_INGEST_APP_RATE_RPS: ${OPENMASU_INGEST_APP_RATE_RPS:-500}
      OPENMASU_INGEST_APP_RATE_BURST: ${OPENMASU_INGEST_APP_RATE_BURST:-1000}
      OPENMASU_MAX_RATE_RPS: ${OPENMASU_MAX_RATE_RPS:-200}
      OPENMASU_MAX_RATE_BURST: ${OPENMASU_MAX_RATE_BURST:-500}
    volumes:
      - .:/repository
      - migration-secrets:/run/openmasu/migration
      - app-secrets:/run/openmasu/app
      - seed-secrets:/run/openmasu/seed
      - postgres-secrets:/run/openmasu/postgres
    restart: "no"

  postgres:
    image: postgres:17-alpine
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: openmasu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/openmasu/postgres/password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openmasu"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${OPENMASU_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-secrets:/run/openmasu/postgres:ro
    networks:
      - backend
      - database-host

  migrate:
    <<: *app
    command: ["/bin/sh", "-c", "set -a && . /run/openmasu/migration/runtime.env && set +a && npm run db:migrate"]
    volumes:
      - migration-secrets:/run/openmasu/migration:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["/bin/sh", "-c", "set -a && . /run/openmasu/app/runtime.env && set +a && node --import tsx apps/api/src/server.ts"]
    volumes:
      - app-secrets:/run/openmasu/app:ro
      - payload-objects:/run/openmasu/payloads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${OPENMASU_API_HOST_PORT:-8080}:8080"
    networks:
      - backend
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    command: ["/bin/sh", "-c", "set -a && . /run/openmasu/app/runtime.env && set +a && node --import tsx apps/worker/src/main.ts"]
    volumes:
      - app-secrets:/run/openmasu/app:ro
      - payload-objects:/run/openmasu/payloads
    depends_on:
      migrate:
        condition: service_completed_successfully

  redirector:
    <<: *app
    command: ["/bin/sh", "-c", "set -a && . /run/openmasu/app/runtime.env && set +a && node --import tsx apps/redirector/src/server.ts"]
    volumes:
      - app-secrets:/run/openmasu/app:ro
      - payload-objects:/run/openmasu/payloads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${OPENMASU_REDIRECTOR_HOST_PORT:-8090}:8090"
    networks:
      - backend
      - edge

  seed:
    <<: *app
    profiles: ["seed"]
    command: ["/bin/sh", "-c", "set -a && . /run/openmasu/seed/runtime.env && set +a && npm run seed"]
    volumes:
      - seed-secrets:/run/openmasu/seed:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  proxy:
    image: caddy:2.11.4-alpine
    profiles: ["proxy"]
    ports:
      - "8443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - backend
      - edge

  s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["s3"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: openmasu-local
      MINIO_ROOT_PASSWORD: openmasu-local-synthetic-only
    volumes:
      - minio-data:/data
    networks:
      - backend

volumes:
  postgres-data:
  migration-secrets:
  app-secrets:
  seed-secrets:
  postgres-secrets:
  minio-data:
  payload-objects:

networks:
  backend:
    internal: true
  database-host:
  edge:
