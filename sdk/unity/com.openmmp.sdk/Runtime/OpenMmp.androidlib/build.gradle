plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.openmmp.unity'
    compileSdk 36
    defaultConfig { minSdk 24 }
}

// Open MMP does not publish Maven artifacts in M2. Build the Android SDK locally,
// publish it to an operator-controlled repository, and substitute this coordinate.
dependencies {
    implementation 'dev.openmmp:core:0.1.0'
    implementation 'dev.openmmp:max:0.1.0'
}
