plugins {
    id 'com.android.library'
}

android {
    namespace 'dev.openmasu.unity'
    compileSdk 36
    defaultConfig { minSdk 24 }
}

// OpenMasu does not publish Maven artifacts in M2. Build the Android SDK locally,
// publish it to an operator-controlled repository, and substitute this coordinate.
dependencies {
    if (findProject(':core') != null && findProject(':max') != null) {
        implementation project(':core')
        implementation project(':max')
    } else {
        implementation 'dev.openmasu:core:0.1.0'
        implementation 'dev.openmasu:max:0.1.0'
    }
}
